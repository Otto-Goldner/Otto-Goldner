<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Otto Goldner, Engenharia de Software no Ibmec">
  <style>
    .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SFMono-Regular", "Cascadia Code", Consolas, "Liberation Mono", monospace; }
    .l { opacity: 0; animation: show .01s forwards; }
    .l1 { animation-delay: .4s; } .l2 { animation-delay: .9s; }
    .l3 { animation-delay: 1.5s; } .l4 { animation-delay: 2s; }
    .l5 { animation-delay: 2.6s; } .l6 { animation-delay: 3.1s; }
    @keyframes show { to { opacity: 1; } }
    .cursor { animation: blink 1s steps(1) infinite; animation-delay: 3.1s; opacity: 0; }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#14203a"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#ffffff" opacity=".06"/>
    </pattern>
    <radialGradient id="glow" cx="0.18" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#5eead4" stop-opacity=".12"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="340" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="20" fill="url(#dots)"/>
  <rect width="1200" height="340" rx="20" fill="url(#glow)"/>

  <!-- texto -->
  <text x="64" y="112" class="mono" font-size="20" fill="#5eead4">oi, eu sou o</text>
  <text x="62" y="186" class="sans" font-size="70" font-weight="700" fill="#e6edf3" letter-spacing="-1.5">Otto Goldner</text>
  <text x="64" y="232" class="sans" font-size="24" fill="#93a4c3">Engenharia de Software · Ibmec</text>

  <g class="mono" font-size="15">
    <rect x="64" y="262" width="118" height="34" rx="17" fill="#1b2742" stroke="#2a3a5c"/>
    <text x="123" y="284" text-anchor="middle" fill="#cfe0f5">automação</text>
    <rect x="194" y="262" width="74" height="34" rx="17" fill="#1b2742" stroke="#2a3a5c"/>
    <text x="231" y="284" text-anchor="middle" fill="#cfe0f5">LLMs</text>
    <rect x="280" y="262" width="164" height="34" rx="17" fill="#1b2742" stroke="#2a3a5c"/>
    <text x="362" y="284" text-anchor="middle" fill="#cfe0f5">cibersegurança</text>
  </g>

  <!-- terminal -->
  <g transform="translate(712 58)">
    <rect width="430" height="226" rx="12" fill="#0a101c" stroke="#24314f"/>
    <path d="M0 12 a12 12 0 0 1 12 -12 h406 a12 12 0 0 1 12 12 v22 h-430 z" fill="#131c2e"/>
    <circle cx="20" cy="17" r="5.5" fill="#ff5f57"/>
    <circle cx="38" cy="17" r="5.5" fill="#febc2e"/>
    <circle cx="56" cy="17" r="5.5" fill="#28c840"/>
    <text x="215" y="22" text-anchor="middle" class="mono" font-size="12" fill="#5b6b88">~/otto</text>

    <g class="mono" font-size="16">
      <text x="22" y="72" class="l l1"><tspan fill="#5eead4">$</tspan><tspan fill="#e6edf3"> whoami</tspan></text>
      <text x="22" y="96" class="l l2" fill="#93a4c3">otto, estudante de eng. de software</text>
      <text x="22" y="132" class="l l3"><tspan fill="#5eead4">$</tspan><tspan fill="#e6edf3"> cat trabalho.txt</tspan></text>
      <text x="22" y="156" class="l l4" fill="#93a4c3">apps com LLM e integrações</text>
      <text x="22" y="192" class="l l5"><tspan fill="#5eead4">$</tspan><tspan fill="#e6edf3"> ./estudando</tspan></text>
      <text x="22" y="216" class="l l6" fill="#f5c26b">cibersegurança</text>
      <rect x="166" y="202" width="9" height="18" fill="#f5c26b" class="cursor"/>
    </g>
  </g>
</svg>
