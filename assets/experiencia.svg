<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 452" width="830" height="452" role="img" aria-label="Trabalho atual: assistente com LLM, editor de diagramas com IA e roteador de modelos">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1526"/><stop offset="1" stop-color="#131d33"/></linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" opacity=".05"/></pattern>
  </defs>
  <rect x=".5" y=".5" width="829" height="451" rx="18" fill="url(#bg)" stroke="#24314f"/>
  <rect x=".5" y=".5" width="829" height="451" rx="18" fill="url(#dots)"/>
  <text x="32" y="60" font-family="-apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#e6edf3" letter-spacing="-.3">Trabalho atual</text>
  <text x="232" y="60" font-family="-apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="17" fill="#93a4c3">aplicações com LLM e integrações</text>
  <g transform="translate(627 42)"><rect x="0" y="0" width="171" height="22" rx="11" fill="none" stroke="#2f4166"/><text x="86" y="15" text-anchor="middle" font-family="ui-monospace, &quot;SFMono-Regular&quot;, &quot;Cascadia Code&quot;, Consolas, monospace" font-size="11.5" fill="#93a4c3">repositórios privados</text></g>
  <g transform="translate(32 94)"><rect width="50" height="50" rx="12" fill="#17233d" stroke="#2a3a5c"/><path d="M12 14 h24 a5 5 0 0 1 5 5 v11 a5 5 0 0 1 -5 5 h-13 l-7 6 v-6 h-4 a5 5 0 0 1 -5 -5 v-11 a5 5 0 0 1 5 -5 z" fill="none" stroke="#5eead4" stroke-width="2.4" stroke-linejoin="round"/><circle cx="17" cy="25" r="2" fill="#5eead4"/><circle cx="24" cy="25" r="2" fill="#5eead4"/><circle cx="31" cy="25" r="2" fill="#5eead4"/></g><text x="104" y="110" font-family="-apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#e6edf3">Assistente com LLM</text><rect x="289" y="95" width="97" height="22" rx="11" fill="none" stroke="#2a5c56"/><text x="337" y="110" text-anchor="middle" font-family="ui-monospace, &quot;SFMono-Regular&quot;, &quot;Cascadia Code&quot;, Consolas, monospace" font-size="11.5" fill="#5eead4">em produção</text><text x="104" y="134" font-family="-apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="14.5" fill="#b6c4dc">Desenvolvi do MVP até a produção. Login com Google e controle de acesso por papel,</text><text x="104" y="154" font-family="-apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="14.5" fill="#b6c4dc">vários modelos (GPT, Claude e Gemini), busca em base de conhecimento, histórico</text><text x="104" y="174" font-family="-apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="14.5" fill="#b6c4dc">de conversas no PostgreSQL e integrações somente leitura com outros sistemas.</text><line x1="104" x2="798" y1="184" y2="184" stroke="#1e2a44"/><g transform="translate(32 192)"><rect width="50" height="50" rx="12" fill="#17233d" stroke="#2a3a5c"/><rect x="9" y="11" width="12" height="9" rx="2" fill="none" stroke="#5eead4" stroke-width="2.2"/><rect x="29" y="11" width="12" height="9" rx="2" fill="none" stroke="#5eead4" stroke-width="2.2"/><rect x="19" y="31" width="12" height="9" rx="2" fill="none" stroke="#5eead4" stroke-width="2.2"/><path d="M15 20 v5 h10 v6 M35 20 v5 h-10" fill="none" stroke="#5eead4" stroke-width="2.2"/></g><text x="104" y="208" font-family="-apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#e6edf3">Editor de diagramas com IA</text><rect x="366" y="193" width="83" height="22" rx="11" fill="none" stroke="#2a5c56"/><text x="407" y="208" text-anchor="middle" font-family="ui-monospace, &quot;SFMono-Regular&quot;, &quot;Cascadia Code&quot;, Consolas, monospace" font-size="11.5" fill="#5eead4">em equipe</text><text x="104" y="232" font-family="-apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="14.5" fill="#b6c4dc">Aplicação web para visualizar e editar diagramas de fluxo. Levei o protótipo para</text><text x="104" y="252" font-family="-apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="14.5" fill="#b6c4dc">produção, com edição assistida por LLM que só grava depois de aprovada, histórico</text><text x="104" y="272" font-family="-apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="14.5" fill="#b6c4dc">de alterações e validação automática do layout a cada deploy.</text><line x1="104" x2="798" y1="282" y2="282" stroke="#1e2a44"/><g transform="translate(32 290)"><rect width="50" height="50" rx="12" fill="#17233d" stroke="#2a3a5c"/><circle cx="12" cy="25" r="4" fill="#5eead4"/><path d="M16 25 h6 M22 25 C28 25 28 14 34 14 M22 25 h12 M22 25 C28 25 28 36 34 36" fill="none" stroke="#5eead4" stroke-width="2.2"/><circle cx="37" cy="14" r="3" fill="none" stroke="#5eead4" stroke-width="2"/><circle cx="37" cy="25" r="3" fill="#f5c26b"/><circle cx="37" cy="36" r="3" fill="none" stroke="#5eead4" stroke-width="2"/></g><text x="104" y="306" font-family="-apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#e6edf3">Roteador de modelos</text><rect x="298" y="291" width="38" height="22" rx="11" fill="none" stroke="#2a5c56"/><text x="318" y="306" text-anchor="middle" font-family="ui-monospace, &quot;SFMono-Regular&quot;, &quot;Cascadia Code&quot;, Consolas, monospace" font-size="11.5" fill="#5eead4">MVP</text><text x="104" y="330" font-family="-apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="14.5" fill="#b6c4dc">Escolhe, para cada tarefa, o modelo de LLM mais adequado e mais barato entre</text><text x="104" y="350" font-family="-apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="14.5" fill="#b6c4dc">OpenAI, Anthropic e Google, com troca automática de provedor quando um falha</text><text x="104" y="370" font-family="-apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="14.5" fill="#b6c4dc">e limite de gasto configurável.</text>
  <rect x="32" y="400" width="100" height="26" rx="13" fill="#1b2742" stroke="#2a3a5c"/><text x="82" y="417.5" text-anchor="middle" font-family="ui-monospace, &quot;SFMono-Regular&quot;, &quot;Cascadia Code&quot;, Consolas, monospace" font-size="13" fill="#cfe0f5">TypeScript</text><rect x="140" y="400" width="75" height="26" rx="13" fill="#1b2742" stroke="#2a3a5c"/><text x="178" y="417.5" text-anchor="middle" font-family="ui-monospace, &quot;SFMono-Regular&quot;, &quot;Cascadia Code&quot;, Consolas, monospace" font-size="13" fill="#cfe0f5">Node.js</text><rect x="223" y="400" width="100" height="26" rx="13" fill="#1b2742" stroke="#2a3a5c"/><text x="273" y="417.5" text-anchor="middle" font-family="ui-monospace, &quot;SFMono-Regular&quot;, &quot;Cascadia Code&quot;, Consolas, monospace" font-size="13" fill="#cfe0f5">PostgreSQL</text><rect x="331" y="400" width="67" height="26" rx="13" fill="#1b2742" stroke="#2a3a5c"/><text x="365" y="417.5" text-anchor="middle" font-family="ui-monospace, &quot;SFMono-Regular&quot;, &quot;Cascadia Code&quot;, Consolas, monospace" font-size="13" fill="#cfe0f5">Docker</text><rect x="407" y="400" width="100" height="26" rx="13" fill="#1b2742" stroke="#2a3a5c"/><text x="457" y="417.5" text-anchor="middle" font-family="ui-monospace, &quot;SFMono-Regular&quot;, &quot;Cascadia Code&quot;, Consolas, monospace" font-size="13" fill="#cfe0f5">Cloudflare</text><rect x="515" y="400" width="108" height="26" rx="13" fill="#1b2742" stroke="#2a3a5c"/><text x="569" y="417.5" text-anchor="middle" font-family="ui-monospace, &quot;SFMono-Regular&quot;, &quot;Cascadia Code&quot;, Consolas, monospace" font-size="13" fill="#cfe0f5">APIs de LLM</text>
</svg>
