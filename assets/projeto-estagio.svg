<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 270" width="830" height="270" role="img" aria-label="Projeto: Gestão de Estágio Obrigatório">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1526"/><stop offset="1" stop-color="#131d33"/></linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" opacity=".07"/></pattern>
    <clipPath id="panel"><rect x="14" y="14" width="246" height="242" rx="12"/></clipPath>
  </defs>
  <rect x=".5" y=".5" width="829" height="269" rx="18" fill="url(#bg)" stroke="#24314f"/>
  <g clip-path="url(#panel)">
    <rect x="14" y="14" width="246" height="242" fill="#101a2e"/>
    <rect x="14" y="14" width="246" height="242" fill="url(#dots)"/>
    
  <g transform="translate(137 135)">
    <rect x="-52" y="-74" width="104" height="132" rx="8" fill="#1a2640" stroke="#2f4166" transform="rotate(-8)"/>
    <rect x="-52" y="-70" width="104" height="132" rx="8" fill="#1e2c4a" stroke="#34497a" transform="rotate(4)"/>
    <rect x="-50" y="-66" width="104" height="132" rx="8" fill="#22324f" stroke="#3b5288"/>
    <text x="-34" y="-38" font-family="ui-monospace, Consolas, monospace" font-size="13" font-weight="700" fill="#5eead4">TCE</text>
    <rect x="-34" y="-24" width="70" height="6" rx="3" fill="#3b5288"/>
    <rect x="-34" y="-10" width="56" height="6" rx="3" fill="#3b5288"/>
    <rect x="-34" y="4" width="64" height="6" rx="3" fill="#3b5288"/>
    <rect x="-34" y="18" width="42" height="6" rx="3" fill="#3b5288"/>
    <circle cx="40" cy="52" r="24" fill="#5eead4"/>
    <path d="M28 52 l8 8 l16 -17" fill="none" stroke="#0d1526" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  </g>
  <rect x="672" y="26" width="134" height="24" rx="12" fill="none" stroke="#2f4166"/>
  <text x="739" y="42.5" text-anchor="middle" font-family="ui-monospace, &quot;SFMono-Regular&quot;, &quot;Cascadia Code&quot;, Consolas, monospace" font-size="12" fill="#93a4c3">projeto back-end</text>
  <text x="290" y="54" font-family="-apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#e6edf3" letter-spacing="-.3">Gestão de Estágio Obrigatório</text>
  <text x="290" y="88" font-family="-apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="16" fill="#b6c4dc">Sistema para a secretaria do Ibmec receber e validar a</text><text x="290" y="110" font-family="-apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="16" fill="#b6c4dc">documentação de estágio. API em Django, com o Gemini</text><text x="290" y="132" font-family="-apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="16" fill="#b6c4dc">ajudando a conferir os relatórios dos alunos.</text>
  <text x="290" y="164" font-family="ui-monospace, &quot;SFMono-Regular&quot;, &quot;Cascadia Code&quot;, Consolas, monospace" font-size="12" letter-spacing="1.5" fill="#5eead4">MINHA PARTE</text>
  <text x="290" y="186" font-family="-apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="15.5" fill="#e6edf3">Autenticação, permissões, histórico de avaliações e a</text><text x="290" y="207" font-family="-apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="15.5" fill="#e6edf3">integração do front em React com a API.</text>
  <rect x="290" y="226" width="67" height="26" rx="13" fill="#1b2742" stroke="#2a3a5c"/><text x="324" y="243.5" text-anchor="middle" font-family="ui-monospace, &quot;SFMono-Regular&quot;, &quot;Cascadia Code&quot;, Consolas, monospace" font-size="13" fill="#cfe0f5">Python</text><rect x="365" y="226" width="67" height="26" rx="13" fill="#1b2742" stroke="#2a3a5c"/><text x="399" y="243.5" text-anchor="middle" font-family="ui-monospace, &quot;SFMono-Regular&quot;, &quot;Cascadia Code&quot;, Consolas, monospace" font-size="13" fill="#cfe0f5">Django</text><rect x="440" y="226" width="100" height="26" rx="13" fill="#1b2742" stroke="#2a3a5c"/><text x="490" y="243.5" text-anchor="middle" font-family="ui-monospace, &quot;SFMono-Regular&quot;, &quot;Cascadia Code&quot;, Consolas, monospace" font-size="13" fill="#cfe0f5">PostgreSQL</text><rect x="548" y="226" width="59" height="26" rx="13" fill="#1b2742" stroke="#2a3a5c"/><text x="578" y="243.5" text-anchor="middle" font-family="ui-monospace, &quot;SFMono-Regular&quot;, &quot;Cascadia Code&quot;, Consolas, monospace" font-size="13" fill="#cfe0f5">React</text><rect x="615" y="226" width="67" height="26" rx="13" fill="#1b2742" stroke="#2a3a5c"/><text x="649" y="243.5" text-anchor="middle" font-family="ui-monospace, &quot;SFMono-Regular&quot;, &quot;Cascadia Code&quot;, Consolas, monospace" font-size="13" fill="#cfe0f5">Gemini</text>
