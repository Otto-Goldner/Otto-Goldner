<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 270" width="830" height="270" role="img" aria-label="Projeto: Detector de Doenças na Soja">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1526"/><stop offset="1" stop-color="#131d33"/></linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" opacity=".07"/></pattern>
    <clipPath id="panel"><rect x="14" y="14" width="246" height="242" rx="12"/></clipPath>
  </defs>
  <rect x=".5" y=".5" width="829" height="269" rx="18" fill="url(#bg)" stroke="#24314f"/>
  <g clip-path="url(#panel)">
    <rect x="14" y="14" width="246" height="242" fill="#101a2e"/>
    <rect x="14" y="14" width="246" height="242" fill="url(#dots)"/>
    
  <g transform="translate(137 144)">
    <path d="M0 74 C-6 40 -64 30 -60 -14 C-56 -54 -14 -72 0 -88 C14 -72 56 -54 60 -14 C64 30 6 40 0 74 Z" fill="#2c6e4f" stroke="#3f9a6e" stroke-width="2"/>
    <path d="M0 74 L0 -80" stroke="#59b98a" stroke-width="2"/>
    <path d="M0 30 L-34 6 M0 6 L-38 -20 M0 -20 L-30 -44 M0 30 L34 6 M0 6 L38 -20 M0 -20 L30 -44" stroke="#4aa577" stroke-width="1.6"/>
    <circle cx="-22" cy="-4" r="6" fill="#b8863b" opacity=".85"/>
    <circle cx="24" cy="-28" r="4.5" fill="#b8863b" opacity=".85"/>
    <circle cx="16" cy="18" r="5" fill="#b8863b" opacity=".85"/>
    <rect x="-74" y="-100" width="148" height="182" rx="4" fill="none" stroke="#5eead4" stroke-width="2" stroke-dasharray="7 5"/>
    <rect x="-74" y="-120" width="54" height="20" rx="3" fill="#5eead4"/>
    <text x="-47" y="-105.5" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="12" font-weight="700" fill="#0d1526">folha</text>
  </g>
  </g>
  <rect x="649" y="26" width="157" height="24" rx="12" fill="none" stroke="#2f4166"/>
  <text x="728" y="42.5" text-anchor="middle" font-family="ui-monospace, &quot;SFMono-Regular&quot;, &quot;Cascadia Code&quot;, Consolas, monospace" font-size="12" fill="#93a4c3">repositório privado</text>
  <text x="290" y="54" font-family="-apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#e6edf3" letter-spacing="-.3">Detector de Doenças na Soja</text>
  <text x="290" y="88" font-family="-apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="16" fill="#b6c4dc">Você fotografa uma folha com o celular, um YOLO acha a</text><text x="290" y="110" font-family="-apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="16" fill="#b6c4dc">folha e um classificador aponta qual doença ela tem.</text><text x="290" y="132" font-family="-apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="16" fill="#b6c4dc">A primeira versão usava uma ESP32-CAM.</text>
  <text x="290" y="164" font-family="ui-monospace, &quot;SFMono-Regular&quot;, &quot;Cascadia Code&quot;, Consolas, monospace" font-size="12" letter-spacing="1.5" fill="#5eead4">MINHA PARTE</text>
  <text x="290" y="186" font-family="-apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="15.5" fill="#e6edf3">Segunda opinião com outro modelo (MobileNetV2), mapa</text><text x="290" y="207" font-family="-apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="15.5" fill="#e6edf3">de calor do que o modelo olhou e testes com fotos reais.</text>
  <rect x="290" y="226" width="67" height="26" rx="13" fill="#1b2742" stroke="#2a3a5c"/><text x="324" y="243.5" text-anchor="middle" font-family="ui-monospace, &quot;SFMono-Regular&quot;, &quot;Cascadia Code&quot;, Consolas, monospace" font-size="13" fill="#cfe0f5">Python</text><rect x="365" y="226" width="67" height="26" rx="13" fill="#1b2742" stroke="#2a3a5c"/><text x="399" y="243.5" text-anchor="middle" font-family="ui-monospace, &quot;SFMono-Regular&quot;, &quot;Cascadia Code&quot;, Consolas, monospace" font-size="13" fill="#cfe0f5">YOLO11</text><rect x="440" y="226" width="100" height="26" rx="13" fill="#1b2742" stroke="#2a3a5c"/><text x="490" y="243.5" text-anchor="middle" font-family="ui-monospace, &quot;SFMono-Regular&quot;, &quot;Cascadia Code&quot;, Consolas, monospace" font-size="13" fill="#cfe0f5">TensorFlow</text><rect x="548" y="226" width="59" height="26" rx="13" fill="#1b2742" stroke="#2a3a5c"/><text x="578" y="243.5" text-anchor="middle" font-family="ui-monospace, &quot;SFMono-Regular&quot;, &quot;Cascadia Code&quot;, Consolas, monospace" font-size="13" fill="#cfe0f5">Flask</text>
</svg>
