<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 170" width="830" height="170" role="img" aria-label="Contato: LinkedIn de Otto Goldner">
  <style>
    .c { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1526"/><stop offset="1" stop-color="#14203a"/></linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" opacity=".05"/></pattern>
    <radialGradient id="glow" cx="0.9" cy="0.5" r="0.5"><stop offset="0" stop-color="#5eead4" stop-opacity=".10"/><stop offset="1" stop-color="#5eead4" stop-opacity="0"/></radialGradient>
  </defs>
  <rect x=".5" y=".5" width="829" height="169" rx="18" fill="url(#bg)" stroke="#24314f"/>
  <rect x=".5" y=".5" width="829" height="169" rx="18" fill="url(#dots)"/>
  <rect x=".5" y=".5" width="829" height="169" rx="18" fill="url(#glow)"/>

  <text x="36" y="62" font-family="-apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#e6edf3" letter-spacing="-.3">Vamos conversar?</text>
  <text x="36" y="94" font-family="-apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="15.5" fill="#b6c4dc">Se quiser trocar uma ideia sobre algum desses projetos,</text>
  <text x="36" y="116" font-family="-apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="15.5" fill="#b6c4dc">ou sobre qualquer outra coisa, me chama no LinkedIn.</text>
  <text x="36" y="146" font-family="ui-monospace, &quot;SFMono-Regular&quot;, &quot;Cascadia Code&quot;, Consolas, monospace" font-size="12.5" fill="#5b6b88">$ exit<tspan class="c" fill="#5eead4"> ▍</tspan></text>

  <g transform="translate(540 58)">
    <rect width="254" height="54" rx="27" fill="#5eead4"/>
    <rect x="16" y="13" width="28" height="28" rx="6" fill="#0d1526"/>
    <text x="30" y="33" text-anchor="middle" font-family="-apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#5eead4">in</text>
    <text x="58" y="25" font-family="-apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0d1526">LinkedIn</text>
    <text x="58" y="42" font-family="ui-monospace, &quot;SFMono-Regular&quot;, &quot;Cascadia Code&quot;, Consolas, monospace" font-size="11.5" fill="#0d3a35">Otto Goldner</text>
    <path d="M222 27 h12 M229 21 l6 6 l-6 6" fill="none" stroke="#0d1526" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
