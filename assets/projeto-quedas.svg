<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 270" width="830" height="270" role="img" aria-label="Projeto: Detecção de Quedas por Wi-Fi">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1526"/><stop offset="1" stop-color="#131d33"/></linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" opacity=".07"/></pattern>
    <clipPath id="panel"><rect x="14" y="14" width="246" height="242" rx="12"/></clipPath>
  </defs>
  <rect x=".5" y=".5" width="829" height="269" rx="18" fill="url(#bg)" stroke="#24314f"/>
  <g clip-path="url(#panel)">
    <rect x="14" y="14" width="246" height="242" fill="#101a2e"/>
    <rect x="14" y="14" width="246" height="242" fill="url(#dots)"/>
    
  <style>
    .w { fill: none; stroke: #5eead4; stroke-width: 3; stroke-linecap: round; opacity: .15; animation: p 2.4s ease-in-out infinite; }
    .w2 { animation-delay: .4s; } .w3 { animation-delay: .8s; }
    @keyframes p { 0%,100% { opacity: .12; } 40% { opacity: .9; } }
  </style>
  <g transform="translate(0 -14)">
    <rect x="34" y="96" width="44" height="62" rx="6" fill="#22324f" stroke="#3b5288"/>
    <rect x="44" y="108" width="24" height="18" rx="2" fill="#2f4166"/>
    <text x="56" y="148" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="9" fill="#93a4c3">ESP32</text>
    <rect x="196" y="96" width="44" height="62" rx="6" fill="#22324f" stroke="#3b5288"/>
    <rect x="206" y="108" width="24" height="18" rx="2" fill="#2f4166"/>
    <text x="218" y="148" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="9" fill="#93a4c3">ESP32</text>
    <path class="w" d="M96 108 q41 -26 82 0"/>
    <path class="w w2" d="M96 127 q41 -14 82 0"/>
    <path class="w w3" d="M96 146 q41 -2 82 0"/>
  </g>
  <polyline points="30,214 70,214 82,210 94,216 104,212 116,178 126,236 136,198 146,216 158,212 170,214 244,214"
            fill="none" stroke="#f5c26b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="121" cy="178" r="4" fill="#f5c26b"/>
  <text x="137" y="248" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="10" fill="#93a4c3">sinal do Wi-Fi (CSI)</text>
  </g>
  <rect x="649" y="26" width="157" height="24" rx="12" fill="none" stroke="#2f4166"/>
  <text x="728" y="42.5" text-anchor="middle" font-family="ui-monospace, &quot;SFMono-Regular&quot;, &quot;Cascadia Code&quot;, Consolas, monospace" font-size="12" fill="#93a4c3">sistemas embarcados</text>
  <text x="290" y="54" font-family="-apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#e6edf3" letter-spacing="-.3">Detecção de Quedas por Wi-Fi</text>
  <text x="290" y="88" font-family="-apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="16" fill="#b6c4dc">Dois ESP32 percebem uma queda pela forma como o corpo</text><text x="290" y="110" font-family="-apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="16" fill="#b6c4dc">perturba o sinal Wi-Fi entre eles. Sem câmera e sem</text><text x="290" y="132" font-family="-apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="16" fill="#b6c4dc">sensor preso ao corpo. Ainda é protótipo de laboratório.</text>
  <text x="290" y="164" font-family="ui-monospace, &quot;SFMono-Regular&quot;, &quot;Cascadia Code&quot;, Consolas, monospace" font-size="12" letter-spacing="1.5" fill="#5eead4">MINHA PARTE</text>
  <text x="290" y="186" font-family="-apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="15.5" fill="#e6edf3">Montei o protótipo com os dois módulos e a ponte que</text><text x="290" y="207" font-family="-apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="15.5" fill="#e6edf3">detecta a queda e avisa o painel do SeniorCare.</text>
  <rect x="290" y="226" width="59" height="26" rx="13" fill="#1b2742" stroke="#2a3a5c"/><text x="320" y="243.5" text-anchor="middle" font-family="ui-monospace, &quot;SFMono-Regular&quot;, &quot;Cascadia Code&quot;, Consolas, monospace" font-size="13" fill="#cfe0f5">ESP32</text><rect x="357" y="226" width="75" height="26" rx="13" fill="#1b2742" stroke="#2a3a5c"/><text x="395" y="243.5" text-anchor="middle" font-family="ui-monospace, &quot;SFMono-Regular&quot;, &quot;Cascadia Code&quot;, Consolas, monospace" font-size="13" fill="#cfe0f5">Arduino</text><rect x="440" y="226" width="75" height="26" rx="13" fill="#1b2742" stroke="#2a3a5c"/><text x="478" y="243.5" text-anchor="middle" font-family="ui-monospace, &quot;SFMono-Regular&quot;, &quot;Cascadia Code&quot;, Consolas, monospace" font-size="13" fill="#cfe0f5">Node.js</text><rect x="524" y="226" width="75" height="26" rx="13" fill="#1b2742" stroke="#2a3a5c"/><text x="562" y="243.5" text-anchor="middle" font-family="ui-monospace, &quot;SFMono-Regular&quot;, &quot;Cascadia Code&quot;, Consolas, monospace" font-size="13" fill="#cfe0f5">Next.js</text>
</svg>
